<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#082d6b"><title>Order Admin | Digital World</title><link rel="stylesheet" href="css/service-store.css"><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header class="top"><a href="index.html"><strong>Digital World</strong></a><span class="back">Secure Admin</span></header><main class="admin-wrap">
