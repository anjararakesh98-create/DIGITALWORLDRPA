<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Client Login | Digital World</title><link rel="stylesheet" href="css/client-portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="css/unified-navigation.css?v=3"><script src="js/unified-navigation.js?v=3" defer></script>
</head><body><main class="wrap"><div class="panel" style="max-width:480px;margin:8vh auto"><div class="brand">Digital World</div><h1>Client Login</h1><p class="muted">Sign in with your registered email address and password.</p><form id="login"><label>Email Address *</label><input name="email" type="email" required autocomplete="username"><label>Password *</label><input name="password" type="password" required autocomplete="current-password"><button style="width:100%;margin-top:18px">Login</button></form><p id="message" class="msg" role="status"></p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><p>New to Digital World?</p><a class="btn secondary" href="create-account.html">New User · Create Your Business Card</a><p class="muted" style="font-size:12px;margin-top:20px"><a href="index.html">← Back to Digital World</a></p></div></main><script>const db=window.supabase.createClient("https://lvbesvjeiaxudhsajyuc.supabase.co","sb_publishable_EhHpIAzaJC3y7MBkcv0wDQ_Vz8kXsnR");document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const f=new FormData(e.currentTarget);const {error}=await db.auth.signInWithPassword({email:String(f.get("email")).trim().toLowerCase(),password:f.get("password")});if(error){document.getElementById("message").textContent="Login failed. Check your email and password, then try again.";b.disabled=false;return;}location.href="client-dashboard.html";});</script></body></html>
