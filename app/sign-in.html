<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | Digital World</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="app.css"></head><body class="app-body"><main class="auth-shell"><a href="../index.html" class="back-link">← Digital World website</a><section class="auth-card"><img src="../images/digital-world-logo.png" alt="Digital World" class="auth-logo"><p class="eyebrow">SECURE WORKSPACE</p><h1>Sign in to your workspace</h1><p class="muted">Use Google or your email to access your authorized workspace.</p><button id="google-login" class="app-btn google-btn">Continue with Google</button><div class="divider">or use email</div><form id="email-form"><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password" minlength="6"></label><button class="app-btn" type="submit">Sign in</button></form><p class="small">New customer? <button id="signup-toggle" class="text-button">Create account</button></p><p id="status" class="status" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="app.js"></script></body></html>
