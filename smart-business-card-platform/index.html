</style></head><body><header class="top"><div class="brand">Digital <span>World</span> <small style="display:block;font-size:10px;letter-spacing:1px;color:#77839a">SMART BUSINESS CARD</small></div><div class="row"><span id="userTag" class="muted"></span><button id="logoutBtn" class="btn alt hidden" onclick="logout()">Logout</button></div></header>

<script>
const SUPABASE_URL="https://lvbesvjeiaxudhsajyuc.supabase.co";
const SUPABASE_KEY="sb_publishable_EhHpIAzaJC3y7MBkcv0wDQ_Vz8kXsnR";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, card=null, role='customer', page='Overview', authMode='signup';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,ok=false){$('authMsg').textContent=t;$('authMsg').className='notice '+(ok?'ok':'');}
function showAuth(mode){authMode=mode;$('authTitle').textContent=mode==='signup'?'Create your digital card':'Welcome back';$('signupFields').classList.toggle('hidden',mode==='login');$('planFields').classList.toggle('hidden',mode==='login');$('signupTab').className=mode==='signup'?'btn':'btn alt';$('loginTab').className=mode==='login'?'btn':'btn alt';$('authSubmit').textContent=mode==='signup'?'Create account & start 7-day trial':'Login';$('authMsg').classList.add('hidden');}
function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)+'-'+Math.random().toString(36).slice(2,6)}
async function authSubmit(e){e.preventDefault();$('authSubmit').disabled=true;try{const email=$('email').value.trim().toLowerCase(),password=$('password').value;
 if(authMode==='signup'){const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:$('ownerName').value.trim()}}});if(error)throw error;if(!data.user)throw Error('Account could not be created.');let u=data.user;if(!data.session){msg('Account created. Please login to continue.',true);showAuth('login');return}
 const {error:pe}=await db.from('user_profiles').upsert({user_id:u.id,full_name:$('ownerName').value.trim(),role:'customer'},{onConflict:'user_id'});if(pe)throw pe;
 const plan=$('plan').value;const {data:c,error:ce}=await db.from('business_cards').insert({user_id:u.id,slug:slugify($('businessName').value),business_name:$('businessName').value.trim(),owner_name:$('ownerName').value.trim(),contact_email:email,contact_mobile:$('mobile').value.trim(),plan_code:plan,card_status:'trial',public_data:{phone:$('mobile').value.trim(),email,tagline:'',about:'',address:'',website:'',whatsapp:'',services:[],products:[],gallery:[],portfolio:[],social:{},hours:'',logo_url:'',cover_url:''}}).select().single();if(ce)throw ce;card=c;user=u;await loadApp();
 }else{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;await loadApp();}
 }catch(err){msg(err.message||'Something went wrong.');}finally{$('authSubmit').disabled=false}}
async function logout(){await db.auth.signOut();location.reload()}
async function boot(){const publicSlug=new URLSearchParams(location.search).get('card');if(publicSlug){await renderPublic(publicSlug);return}const {data}=await db.auth.getSession();if(data.session){user=data.session.user;await loadApp()}else showAuth('signup')}
async function loadApp(){const {data:prof}=await db.from('user_profiles').select('role,full_name').eq('user_id',user.id).maybeSingle();role=prof?.role||'customer';const {data:c,error}=await db.from('business_cards').select('*').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!c){$('authView').classList.remove('hidden');showAuth('signup');msg('No business card is linked to this account. Contact support.');return}card=c;$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('userTag').textContent=user.email;$('welcome').textContent='Welcome, '+(card.owner_name||'');$('statusLine').textContent='Trial ends: '+new Date(card.trial_ends_at).toLocaleDateString('en-IN')+' · Plan: '+(card.plan_code==='with-nfc'?'NFC':'Digital');$('statusPill').textContent=card.card_status.toUpperCase();renderNav();await renderPage('Overview')}
const pages=['Overview','Business Profile','Products','Services','Gallery','Portfolio','Public Card & QR','Leads','Analytics','Payments'];function renderNav(){const all=role==='admin'||role==='super_admin'?[...pages,'Admin Dashboard']:pages;$('nav').innerHTML=all.map(p=>'<button class="'+(page===p?'active':'')+'" onclick="renderPage(\''+p+'\')">'+p+'</button>').join('')}
async function savePublic(data){const {error}=await db.from('business_cards').update({public_data:data,updated_at:new Date().toISOString()}).eq('id',card.id);if(error)throw error;card.public_data=data;alert('Saved securely to cloud.');}
function data(){return card.public_data||{}}
function field(label,key,val='',type='text'){return '<div class="field"><label>'+label+'</label><input id="f_'+key+'" type="'+type+'" value="'+esc(val)+'"></div>'}
function area(label,key,val=''){return '<div class="field"><label>'+label+'</label><textarea id="f_'+key+'">'+esc(val)+'</textarea></div>'}
function get(key){return $('f_'+key)?.value?.trim()||''}
async function renderPage(p){page=p;renderNav();let d=data(),out='';
 if(p==='Overview'){const {count:leads}=await db.from('business_card_leads').select('*',{count:'exact',head:true}).eq('card_id',card.id);const {count:views}=await db.from('business_card_analytics').select('*',{count:'exact',head:true}).eq('card_id',card.id).eq('event_type','view');out='<div class="grid"><div class="card"><div class="muted">Public card views</div><div class="stat">'+(views||0)+'</div></div><div class="card"><div class="muted">Enquiries</div><div class="stat">'+(leads||0)+'</div></div><div class="card"><div class="muted">Trial days remaining</div><div class="stat">'+Math.max(0,Math.ceil((new Date(card.trial_ends_at)-Date.now())/86400000))+'</div></div><div class="card"><div class="muted">Account status</div><div class="stat" style="font-size:20px">'+esc(card.card_status)+'</div></div></div><div class="section card"><h2>Next steps</h2><p>Complete your business profile, add products and services, then publish your digital card.</p><button class="btn" onclick="renderPage(\'Business Profile\')">Complete profile</button></div>'}
 if(p==='Business Profile'){out='<div class="panel"><h2>Business Profile</h2><div class="grid">'+field('Business name','business_name',card.business_name)+field('Owner name','owner_name',card.owner_name)+field('Phone','phone',d.phone||card.contact_mobile)+field('Email','email',d.email||card.contact_email,'email')+field('WhatsApp number (with country code)','whatsapp',d.whatsapp)+field('Website URL','website',d.website,'url')+field('Address','address',d.address)+field('Business hours','hours',d.hours)+field('Logo image URL','logo_url',d.logo_url,'url')+field('Cover image URL','cover_url',d.cover_url,'url')+'</div><div class="grid"><div class="field"><label>Upload logo (PNG/JPG/WebP, max 5MB)</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label>Upload cover image</label><input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp"></div></div>'+area('Tagline','tagline',d.tagline)+area('About business','about',d.about)+'<button class="btn" onclick="saveProfile()">Save profile</button></div>'}
 if(['Products','Services','Gallery','Portfolio'].includes(p)){const key=p.toLowerCase(),arr=d[key]||[];out='<div class="panel"><h2>'+p+'</h2><div id="items">'+arr.map((v,i)=>'<div class="item"><b>'+esc(v.title||v.name||'Item')+'</b> · '+esc(v.description||v.url||'')+' <button class="btn alt" onclick="removeItem(\''+key+'\','+i+')">Remove</button></div>').join('')+'</div><div class="grid">'+field(p==='Gallery'?'Image URL':'Title','item_title')+field('Image / Link URL','item_url','', 'url')+'</div>'+area('Description','item_desc')+'<button class="btn" onclick="addItem(\''+key+'\')">Add item</button></div>'}
 if(p==='Public Card & QR'){const url=location.origin+location.pathname+'?card='+encodeURIComponent(card.slug);out='<div class="panel"><h2>Public Digital Card</h2><p>Share this public URL with customers.</p><p><a target="_blank" href="'+esc(url)+'">'+esc(url)+'</a></p><div id="qrcode"></div><button class="btn alt" onclick="copyText(\''+esc(url)+'\')">Copy link</button><button class="btn" onclick="window.open(\''+esc(url)+'\',\'_blank\')">Preview card</button><p class="muted">Public card visibility: active cards and unexpired 7-day trials.</p></div>';setTimeout(()=>{if(window.QRCode)new QRCode($('qrcode'),{text:url,width:180,height:180})},50)}
 if(p==='Leads'){const {data:rows,error}=await db.from('business_card_leads').select('*').eq('card_id',card.id).order('created_at',{ascending:false});if(error)out='<p>'+esc(error.message)+'</p>';else out='<div class="panel"><h2>Customer Enquiries</h2>'+((rows||[]).map(x=>'<div class="item"><b>'+esc(x.name)+'</b> · '+esc(x.phone)+' · '+esc(x.email)+'<p>'+esc(x.message)+'</p><small>'+new Date(x.created_at).toLocaleString('en-IN')+'</small></div>').join('')||'No enquiries yet.')+'</div>'}
 if(p==='Analytics'){const {data:rows,error}=await db.from('business_card_analytics').select('event_type,created_at').eq('card_id',card.id).order('created_at',{ascending:false}).limit(500);const counts={};(rows||[]).forEach(x=>counts[x.event_type]=(counts[x.event_type]||0)+1);out='<div class="panel"><h2>Analytics</h2><div class="grid">'+Object.entries(counts).map(([k,v])=>'<div class="card"><div class="muted">'+esc(k)+'</div><div class="stat">'+v+'</div></div>').join('')+'</div><p class="muted">Latest 500 events shown in aggregate. Analytics counts public-card interactions.</p></div>'}
 if(p==='Payments'){const {data:rows}=await db.from('business_card_payments').select('*').eq('card_id',card.id).order('created_at',{ascending:false});out='<div class="panel"><h2>Plan & Payment</h2><p>₹299 Digital only · ₹499 NFC card + ₹59 shipping. Both plans valid for 5 years after approval.</p><div class="notice">Pay using the QR code shared by Digital World. Submit your UTR below. UTR submission does not activate the plan; manual verification is required.</div>'+field('UPI UTR / transaction reference','utr')+area('Payment details (optional)','paydetails')+'<button class="btn orange" onclick="submitPayment()">Submit payment reference</button><h3>Payment history</h3>'+((rows||[]).map(x=>'<div class="item">₹'+x.amount_inr+' · '+esc(x.payment_status)+' · '+esc(x.utr_reference)+' · '+new Date(x.created_at).toLocaleDateString('en-IN')+'</div>').join('')||'No payments submitted.')+'</div>'}
 if(p==='Admin Dashboard'&&(role==='admin'||role==='super_admin')){const [{data:cards},{data:payments},{data:leads}] = await Promise.all([db.from('business_cards').select('*').order('created_at',{ascending:false}),db.from('business_card_payments').select('*').order('created_at',{ascending:false}),db.from('business_card_leads').select('*',{count:'exact'} )]);out='<div class="panel"><h2>Admin Dashboard</h2><div class="grid"><div class="card"><div class="muted">Total cards</div><div class="stat">'+(cards||[]).length+'</div></div><div class="card"><div class="muted">Payment requests</div><div class="stat">'+(payments||[]).filter(x=>x.payment_status==='pending_verification').length+'</div></div><div class="card"><div class="muted">Total leads</div><div class="stat">'+(leads||[]).length+'</div></div></div><h3>Business Cards</h3><table class="table"><tr><th>Business</th><th>Owner</th><th>Status</th><th>Trial end</th><th>Account controls</th></tr>'+((cards||[]).map(c=>'<tr><td>'+esc(c.business_name)+'</td><td>'+esc(c.owner_name)+'</td><td>'+esc(c.card_status)+'</td><td>'+new Date(c.trial_ends_at).toLocaleDateString('en-IN')+'</td><td><button class="btn danger" onclick="setCardStatus(\''+c.id+'\',\'suspended\')">Suspend</button> <button class="btn alt" onclick="setCardStatus(\''+c.id+'\',\'active\')">Activate</button></td></tr>').join(''))+'</table><h3>Manual Payment Approval</h3>'+((payments||[]).map(x=>'<div class="item">₹'+x.amount_inr+' · '+esc(x.plan_code)+' · UTR: '+esc(x.utr_reference)+' · '+esc(x.payment_status)+(x.payment_status==='pending_verification'?' <button class="btn" onclick="verifyPayment(\''+x.id+'\',\''+x.card_id+'\')">Verify & activate</button> <button class="btn danger" onclick="rejectPayment(\''+x.id+'\')">Reject</button>':'')+'</div>').join('')||'No payment requests.')+'</div>'}
 $('content').innerHTML=out||'<div class="panel">This page is not available for this account.</div>'}
async function uploadAsset(file,kind){if(!file)return null;if(file.size>5242880)throw Error('Image must be 5MB or smaller.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Only PNG, JPG or WebP images are allowed.');const ext=file.name.split('.').pop().toLowerCase(),path=user.id+'/'+card.id+'/'+kind+'-'+Date.now()+'.'+ext;const {error}=await db.storage.from('client-card-assets').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return db.storage.from('client-card-assets').getPublicUrl(path).data.publicUrl}\nasync function saveProfile(){try{const d={...data()};const logo=await uploadAsset($('logoFile')?.files?.[0],'logo'),cover=await uploadAsset($('coverFile')?.files?.[0],'cover');if(logo)d.logo_url=logo;if(cover)d.cover_url=cover;for(const k of ['phone','email','whatsapp','website','address','hours','logo_url','cover_url','tagline','about'])d[k]=get(k);const bn=get('business_name'),on=get('owner_name');const {error}=await db.from('business_cards').update({business_name:bn,owner_name:on,contact_mobile:d.phone,contact_email:d.email,public_data:d}).eq('id',card.id);if(error)throw error;card.business_name=bn;card.owner_name=on;card.public_data=d;alert('Profile saved to cloud.')}catch(e){alert(e.message)}}
async function addItem(k){const d={...data()},a=[...(d[k]||[])];const title=get('item_title'),url=get('item_url'),description=get('item_desc');if(!title&&!url){alert('Enter a title or URL.');return}a.push({title,url,description});d[k]=a;try{await savePublic(d);renderPage(k[0].toUpperCase()+k.slice(1))}catch(e){alert(e.message)}}
async function removeItem(k,i){const d={...data()};d[k]=(d[k]||[]).filter((_,n)=>n!==i);try{await savePublic(d);renderPage(k[0].toUpperCase()+k.slice(1))}catch(e){alert(e.message)}}
async function submitPayment(){const utr=get('utr');if(utr.length<8||utr.length>64){alert('Enter a valid UTR/reference (8–64 characters).');return}const withNfc=card.plan_code==='with-nfc';const {error}=await db.from('business_card_payments').insert({card_id:card.id,user_id:user.id,plan_code:card.plan_code,amount_inr:withNfc?558:299,shipping_inr:withNfc?59:0,utr_reference:utr,reference_details:get('paydetails'),payment_status:'pending_verification'});if(error){alert(error.message);return}alert('Payment reference submitted. Account will activate only after manual verification.');await renderPage('Payments')}
async function setCardStatus(id,status){if(!confirm('Change this business card status to '+status+'?'))return;const {error}=await db.from('business_cards').update({card_status:status}).eq('id',id);if(error)alert(error.message);else renderPage('Admin Dashboard')}\nasync function verifyPayment(pid,cid){if(!confirm('Confirm that payment is visible in the bank/UPI merchant account and activate this card for 5 years?'))return;const {error:pe}=await db.from('business_card_payments').update({payment_status:'verified',verified_by:user.id,verified_at:new Date().toISOString()}).eq('id',pid);if(pe){alert(pe.message);return}const {error:ce}=await db.from('business_cards').update({card_status:'active',activated_at:new Date().toISOString(),valid_until:new Date(Date.now()+5*365.25*86400000).toISOString()}).eq('id',cid);if(ce){alert('Payment marked verified, but card activation failed: '+ce.message);return}alert('Payment verified and card activated.');renderPage('Admin Dashboard')}
async function rejectPayment(id){const note=prompt('Reason for rejection (optional):')||'';const {error}=await db.from('business_card_payments').update({payment_status:'rejected',verified_by:user.id,verified_at:new Date().toISOString(),verification_note:note}).eq('id',id);if(error)alert(error.message);else renderPage('Admin Dashboard')}
async function renderPublic(slug){$('authView').classList.add('hidden');$('appView').classList.add('hidden');$('publicView').classList.remove('hidden');const {data:c,error}=await db.from('business_cards').select('*').eq('slug',slug).maybeSingle();if(error||!c){$('publicView').innerHTML='<div class="panel">Business card not found.</div>';return}const d=c.public_data||{};const isLive=c.card_status==='active'||(c.card_status==='trial'&&new Date(c.trial_ends_at)>new Date());if(!isLive){$('publicView').innerHTML='<div class="panel">This digital card is currently unavailable.</div>';return}db.from('business_card_analytics').insert({card_id:c.id,event_type:'view'});const links=[['Call','tel:'+encodeURIComponent(d.phone||c.contact_mobile||'')],['WhatsApp','https://wa.me/'+(d.whatsapp||d.phone||c.contact_mobile||'').replace(/\D/g,'')],['Email','mailto:'+(d.email||c.contact_email||'')],['Website',d.website],['Location',d.address?'https://maps.google.com/?q='+encodeURIComponent(d.address):'']].filter(x=>x[1]);$('publicView').innerHTML='<div class="hero">'+(d.logo_url?'<img src="'+esc(d.logo_url)+'" alt="" style="max-width:90px;max-height:70px;object-fit:contain;background:#fff;border-radius:10px;padding:5px">':'')+'<h1>'+esc(c.business_name)+'</h1><p>'+esc(d.tagline||'')+'</p><p>'+esc(c.owner_name)+'</p></div><div class="panel" style="margin-top:14px"><h2>About</h2><p>'+esc(d.about||'')+'</p><p>'+esc(d.address||'')+'</p><div class="row">'+links.map(([t,u])=>'<a class="btn" style="text-decoration:none" target="_blank" href="'+esc(u)+'">'+t+'</a>').join('')+'</div></div>'+['services','products','gallery','portfolio'].map(k=>'<div class="panel section"><h2>'+k[0].toUpperCase()+k.slice(1)+'</h2>'+((d[k]||[]).map(v=>'<div class="item"><b>'+esc(v.title||v.name||'')+'</b><p>'+esc(v.description||'')+'</p>'+(v.url?'<a target="_blank" href="'+esc(v.url)+'">View</a>':'')+'</div>').join('')||'<p class="muted">Details coming soon.</p>')+'</div>').join('')+'<div class="panel section"><h2>Contact this business</h2><form onsubmit="sendLead(event,\''+c.id+'\')">'+field('Your name','lead_name')+field('Phone','lead_phone')+field('Email','lead_email','', 'email')+area('Message','lead_message')+'<button class="btn orange">Send enquiry</button></form><div id="leadMsg"></div></div>'}
async function sendLead(e,id){e.preventDefault();const {error}=await db.from('business_card_leads').insert({card_id:id,name:$('f_lead_name').value.trim(),phone:$('f_lead_phone').value.trim(),email:$('f_lead_email').value.trim(),message:$('f_lead_message').value.trim()});$('leadMsg').textContent=error?error.message:'Enquiry sent successfully.'}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('Copied.')).catch(()=>alert(t))}
boot().catch(e=>{console.error(e);$('authView').classList.remove('hidden');msg(e.message||'Unable to load account.')});
</script></body></html>
