name: Digital World site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/service-store.js
          node --check js/admin.js
          node --check js/client-dashboard.js
          node --check js/public-card.js
          node --check js/google-ads-conversions.js
      - name: Check inline JavaScript syntax
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          for (const file of ['create-account.html','client-login.html']) {
            const html=fs.readFileSync(file,'utf8');
            for (const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) {
              if (match[1].trim()) new Function(match[1]);
            }
          }
          console.log('Inline scripts are syntactically valid.');
          JS
      - name: Check required pages and local assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("src", "href"):
                      value = attrs.get(key, "")
                      if value and not value.startswith(("http://", "https://", "mailto:", "tel:", "#", "data:", "javascript:")):
                          self.refs.append(value.split("#", 1)[0].split("?", 1)[0])
          pages = ("index.html","store.html","admin.html","business-card.html","create-account.html","client-login.html","client-dashboard.html","public-card.html")
          for page in pages:
              path = Path(page)
              assert path.is_file(), f"Missing page: {page}"
              parser = Checker()
              parser.feed(path.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  if ref:
                      assert Path(ref).is_file(), f"{page} references missing local asset: {ref}"
          import xml.etree.ElementTree as ET
          ET.parse("sitemap.xml")
          assert "Sitemap: https://www.digitalworldrpa.in/sitemap.xml" in Path("robots.txt").read_text()
          print("Required pages, local references, sitemap and robots file are valid.")
          PY
