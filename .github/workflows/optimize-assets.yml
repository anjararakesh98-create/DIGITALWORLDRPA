name: Optimize website images

on:
  push:
    branches:
      - performance-mobile-image-optimization
    paths:
      - ".github/workflows/optimize-assets.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: performance-mobile-image-optimization
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install image optimizer
        run: npm install --no-save sharp
      - name: Optimize logo and portfolio images
        run: node scripts/optimize-assets.mjs
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images index.html
          git commit -m "Optimize homepage images for mobile performance" || exit 0
          git push origin HEAD:performance-mobile-image-optimization
