<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Client Workspace | Digital World</title><link rel="stylesheet" href="css/client-portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><header class="top"><div><div class="brand">Digital World · Client Workspace</div><div id="identity" class="muted"></div></div><button id="logout" class="secondary">Sign out</button></header><section class="panel"><h1 id="businessTitle">Loading your card…</h1><p id="status" class="muted"></p><div class="row"><a id="publicLink" class="share" target="_blank" rel="noopener"></a><button id="copy" class="secondary" type="button">Copy share link</button></div></section><section class="panel section"><h2>My Business Profile</h2><form id="profile"><label>Business Name *</label><input id="business" required maxlength="100"><label>Owner Name *</label><input id="owner" required maxlength="80"><label>Mobile Number</label><input id="mobile" type="tel" maxlength="20"><label>Business Category</label><input id="category" maxlength="80"><label>Tagline</label><input id="tagline" maxlength="140"><label>About Business</label><textarea id="about" rows="4" maxlength="2000"></textarea><label>WhatsApp Number</label><input id="whatsapp" maxlength="20"><label>Website</label><input id="website" type="url"><label>Address</label><textarea id="address" rows="2"></textarea><label>Services (one per line)</label><textarea id="services" rows="3"></textarea><label>Products & Pricing (one per line)</label><textarea id="products" rows="3"></textarea><label>Instagram URL</label><input id="instagram" type="url"><label>Facebook URL</label><input id="facebook" type="url"><label>Logo Image URL</label><input id="logo" type="url"><button style="margin-top:18px">Save Changes</button></form><p id="saveMessage" class="msg" role="status"></p></section><script src="js/client-workspace.js"></script></main></body></html>
