<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="theme-color" content="#082d6b"><title>Digital Business Card | Digital World</title><meta name="description" content="Digital World smart digital business card."><link rel="stylesheet" href="css/client-portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
