<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082d6b"><title>Create Your Smart Business Card Account | Digital World</title><meta name="description" content="Create your Digital World Smart Digital Business Card account and start your seven-day free trial."><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="css/client-portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="css/unified-navigation.css?v=1"><script src="js/unified-navigation.js" defer></script>
</head>
<body><main class="wrap"><section class="panel" style="max-width:620px;margin:5vh auto"><div class="brand">Digital World</div><p class="muted">SMART DIGITAL BUSINESS CARD</p><h1>Create your account</h1><p class="muted">Create your login and start your 7-day free trial. Your email is your login ID; mobile is used only as contact information.</p>
<form id="signup"><label>Business Name *</label><input name="business" required maxlength="100"><label>Owner Name *</label><input name="owner" required maxlength="80"><label>Mobile Number *</label><input name="mobile" type="tel" required pattern="[0-9+ -]{10,15}" maxlength="15"><label>Email Address (Login ID) *</label><input name="email" type="email" required autocomplete="email"><label>Create Password *</label><input name="password" type="password" required minlength="8" autocomplete="new-password"><label>Business Card Plan *</label><select name="plan" id="plan" required><option value="without-nfc">Without NFC · ₹299 / 5 years</option><option value="with-nfc">With NFC · ₹499 + ₹59 shipping / 5 years</option></select><div id="shippingFields" hidden><h3>Physical NFC Card Delivery</h3><label>Shipping Address *</label><textarea name="shipping_address" id="shippingAddress" maxlength="400" rows="2"></textarea><label>City *</label><input name="shipping_city" id="shippingCity" maxlength="80"><label>State *</label><input name="shipping_state" id="shippingState" maxlength="80"><label>PIN Code *</label><input name="shipping_pincode" id="shippingPincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></div><button id="submit" style="width:100%;margin-top:20px">Create Account &amp; Open Client Dashboard</button></form>
<p id="message" class="msg" role="status"></p><p class="muted" style="font-size:12px">Already registered? <a href="client-login.html">Client Login</a> · <a href="index.html">Back to website</a></p></section></main>
<script>
const db=window.supabase.createClient("https://lvbesvjeiaxudhsajyuc.supabase.co","sb_publishable_EhHpIAzaJC3y7MBkcv0wDQ_Vz8kXsnR");
const requestedPlan=new URLSearchParams(location.search).get("plan");if(["without-nfc","with-nfc"].includes(requestedPlan))document.querySelector('select[name="plan"]').value=requestedPlan;
const planSelect=document.getElementById("plan"),shippingFields=document.getElementById("shippingFields");function syncShipping(){const enabled=planSelect.value==="with-nfc";shippingFields.hidden=!enabled;["shippingAddress","shippingCity","shippingState","shippingPincode"].forEach(id=>document.getElementById(id).required=enabled);}planSelect.addEventListener("change",syncShipping);syncShipping();
document.getElementById("signup").addEventListener("submit",async e=>{
 e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("message"),f=new FormData(e.currentTarget);
 const email=String(f.get("email")).trim().toLowerCase(),password=String(f.get("password")),mobile=String(f.get("mobile")).trim(),plan=String(f.get("plan"));
 if(!/^[0-9+ -]{10,15}$/.test(mobile)){m.textContent="Enter a valid mobile number.";return;}
 b.disabled=true;m.textContent="Creating your secure account…";
 const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:new URL("client-login.html",location.href).href,data:{full_name:String(f.get("owner")).trim(),business_name:String(f.get("business")).trim(),mobile,plan_code:plan,shipping_address:plan==="with-nfc"?String(f.get("shipping_address")).trim():"",shipping_city:plan==="with-nfc"?String(f.get("shipping_city")).trim():"",shipping_state:plan==="with-nfc"?String(f.get("shipping_state")).trim():"",shipping_pincode:plan==="with-nfc"?String(f.get("shipping_pincode")).trim():""} }});
 if(error){m.textContent=error.message;b.disabled=false;return;}
 if(data.session){location.href="client-dashboard.html";return;}
 m.textContent="Account created. Verify your email using the link sent to your inbox, then sign in. Email confirmation is currently required by the account settings.";b.disabled=false;
});
</script></body></html>
