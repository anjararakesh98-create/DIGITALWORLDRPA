<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Workspace | Digital World</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#082d6b"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#082d6b;--blue:#0756c8;--orange:#ff8a00;--ink:#172033;--muted:#68758b;--line:#e5eaf2;--bg:#f5f8fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Inter,Arial,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:2}.logo{width:112px;height:68px;object-fit:contain;display:block;flex:0 0 auto}.brand{font-weight:850;color:var(--navy)}.brand small{display:block;color:var(--orange);font-size:9px;letter-spacing:1.5px}.right{margin-left:auto;display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}.logout{border:1px solid var(--line);background:white;color:var(--navy);padding:9px 13px;border-radius:9px;font-weight:700}.shell{min-height:calc(100vh - 72px);display:grid;grid-template-columns:245px 1fr}.side{background:var(--navy);padding:22px 14px;color:white;display:flex;flex-direction:column;gap:5px}.label{font-size:10px;letter-spacing:1.7px;color:#a9c0e8;font-weight:800;padding:5px 12px 12px}.side button{background:transparent;color:#dce8ff;text-align:left;border:0;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;cursor:pointer}.side button:hover,.side button.active{background:#ffffff1c;color:#fff}.side .foot{margin-top:auto;color:#b5c9e8;font-size:11px;padding:16px 10px}.main{padding:30px;min-width:0}.welcome{display:flex;justify-content:space-between;gap:15px;align-items:center}.kicker{color:var(--orange);font-size:10px;font-weight:900;letter-spacing:1.7px}.welcome h1{margin:7px 0;color:var(--navy);font-size:29px}.welcome p{margin:0;color:var(--muted)}.trial{margin:18px 0;background:#fff4e8;border:1px solid #ffd9b2;color:#995000;border-radius:12px;padding:13px 16px;font-weight:750;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 5px 20px #082d6b08}.card span{font-size:10px;color:#718098;font-weight:900;letter-spacing:1px}.card b{display:block;color:var(--navy);font-size:17px;margin:9px 0 4px}.card small{color:var(--muted)}.section-title{color:var(--navy);margin:25px 0 6px;font-size:21px}.muted{color:var(--muted);margin:0 0 16px}.panel h2{color:var(--navy);margin:0 0 8px}.field{margin:13px 0}.field label{display:block;color:#3d485b;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #dce3ee;background:#fff;color:#111;padding:12px;border-radius:10px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0756c815}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:800}.secondary{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:10px;padding:11px 17px;font-weight:800}.note{background:#eef5ff;border-left:4px solid var(--blue);padding:14px;border-radius:10px;color:#53647d;font-size:13px;margin-top:20px}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;padding:9px}.label,.foot{display:none!important}.side button{white-space:nowrap;flex:0 0 auto}.main{padding:20px 14px}.cards{grid-template-columns:1fr}.welcome{align-items:flex-start;flex-direction:column}.right{gap:7px}.top{padding:0 12px}}
</style>
<style>
:root{--green:#14804a;--red:#b42318}.side button{transition:background .2s,transform .2s}.side button:active{transform:scale(.98)}.card,.panel{transition:transform .22s,box-shadow .22s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #082d6b16}.card b{overflow-wrap:anywhere}.primary,.secondary,.logout{cursor:pointer;transition:filter .2s,transform .2s}.primary:hover,.secondary:hover,.logout:hover{filter:brightness(.97);transform:translateY(-1px)}.field textarea{min-height:90px;resize:vertical}.field input:focus-visible,.field textarea:focus-visible,button:focus-visible{outline:3px solid #00c2ff66;outline-offset:2px}.workspace-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.status-pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#eaf7ef;color:#17643d;font-size:11px;font-weight:850}.status-pill.warn{background:#fff4e8;color:#995000}.qr-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.qr-box{background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px;min-width:160px;min-height:160px;display:grid;place-items:center}.data-list{display:grid;gap:10px}.data-row{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fbfcff}.data-row b{display:block;color:var(--navy)}.empty{padding:22px;border:1px dashed #cbd5e1;border-radius:12px;color:var(--muted);text-align:center}.field small{display:block;color:var(--muted);margin-top:5px}.top .logo{max-width:112px}.side button span{font-size:13px}.toast{margin-top:12px;padding:10px 12px;border-radius:9px;background:#eef5ff;color:#174b92}.toast.error{background:#fff0ef;color:#a12a20}.toast.good{background:#eaf7ef;color:#17643d}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:sticky;top:76px;z-index:3;flex-direction:row;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}.side button{min-height:42px}.main{padding:20px 14px}.cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.qr-wrap{align-items:flex-start}}
@media(max-width:520px){.top{height:66px}.top .logo{height:54px;width:90px}.side{top:66px}.main{padding:16px 12px}.welcome h1{font-size:24px}.cards{grid-template-columns:1fr}.panel{padding:16px}}
</style>
</head><body>
<header class="top"><div class="brand">Digital World<small>CREATIVE. DIGITAL. GROWTH.</small></div><div class="right"><span id="identity">Client Account</span><button class="logout" onclick="logout()">Logout</button></div></header>
<div class="shell"><aside class="side" id="side"><div class="label">WORKSPACE</div><button class="active" data-id="home" onclick="home()">▦ <span>Dashboard</span></button><button data-id="profile" onclick="section('profile')">♙ <span>My Business Profile</span></button><button data-id="contact" onclick="section('contact')">☎ <span>Contact Details</span></button><button data-id="services" onclick="section('services')">✧ <span>Services</span></button><button data-id="products" onclick="section('products')">▣ <span>Products & Pricing</span></button><button data-id="gallery" onclick="section('gallery')">▧ <span>Gallery</span></button><button data-id="portfolio" onclick="section('portfolio')">▤ <span>Portfolio</span></button><button data-id="google" onclick="section('google')">⌖ <span>Google Location & Reviews</span></button><button data-id="social" onclick="section('social')">◎ <span>Social Media</span></button><button data-id="qr" onclick="section('qr')">▦ <span>QR & Share Link</span></button><button data-id="leads" onclick="section('leads')">↗ <span>Leads & Enquiries</span></button><button data-id="analytics" onclick="section('analytics')">▥ <span>Analytics</span></button><button data-id="preview" onclick="section('preview')">▣ <span>Card Preview</span></button><button data-id="orders" onclick="section('orders')">▤ <span>Service Orders</span></button><button data-id="payment" onclick="section('payment')">₹ <span>Card Payment</span></button><div class="foot">Creative. Digital. Growth.</div></aside>
<main class="main"><div id="content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/client-workspace.js?v=1"></script></body></html>
